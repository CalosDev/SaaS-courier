services:
  migrate:
    image: ${API_IMAGE}
    command:
      - ./node_modules/.bin/prisma
      - migrate
      - deploy
      - --config
      - ./prisma.config.ts
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"
    profiles: ["migration"]

  api:
    image: ${API_IMAGE}
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECURE: "true"
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN}
      TENANT_SUBDOMAINS_ENABLED: "true"
      TENANT_ALLOW_BARE_LOCALHOST: "false"
      TRUST_PROXY: ${TRUST_PROXY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      READINESS_REQUIRE_S3: "true"
      READINESS_REQUIRE_SMTP: "true"
      READINESS_CACHE_TTL_MS: ${READINESS_CACHE_TTL_MS:-5000}
      FILE_SCAN_MODE: clamav
      CLAMAV_HOST: ${CLAMAV_HOST}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-10000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ${WEB_IMAGE}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
